services:
  postgres-db:
    image: postgres:15
    container_name: todo_postgres
    environment:
      POSTGRES_DB: todo_list_db
      POSTGRES_USER: ${DB_USERNAME:-123456}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d todo_list_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
