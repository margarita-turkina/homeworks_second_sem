spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  name: To-Do List Manager
  version: 2.0.0
  api:
    version: 2.0.0
  upload-dir: uploads

server:
  port: 8080
