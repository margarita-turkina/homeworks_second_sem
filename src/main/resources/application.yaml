server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: To-Do List Manager
  version: 2.0.0
  api:
    version: 2.0.0
  upload-dir: uploads